# blank_issues_enabled stays TRUE on purpose: a template that does not fit is a
# reason to file a plain issue, not a reason to give up. The templates exist to
# make the common reports good, not to gate the uncommon ones.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/askalf/redstamp/security/advisories/new
    about: >
      Never file a vulnerability as a public issue. Private advisories let us
      ship a fix before the details are public — see SECURITY.md.

  - name: Content you believe is genuinely attacking agents
    url: https://github.com/askalf/redstamp/blob/master/SECURITY.md
    about: >
      Do not open a public issue naming a package, skill or vendor as
      hostile before it is triaged. Follow the coordinated-disclosure path so the operator hears it
      first and a false accusation never gets published.
