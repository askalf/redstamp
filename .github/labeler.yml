# Path → label map for .github/workflows/pr-triage.yml (actions/labeler v7).
#
# Additive only: sync-labels is off, so nothing here ever strips a label a
# human — or Dependabot — put on a PR by hand. Add a path, get a label.

detection:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/scan.mjs'
          - 'src/classify.mjs'
          - 'src/taint.mjs'
          - 'src/policy.mjs'
          - 'src/judge.mjs'

cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/cli.mjs'
          - 'src/daemon-cli.mjs'
          - 'src/daemon.mjs'
          - 'src/wrap.mjs'
          - 'src/cc-hook.mjs'

mcp:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/mcp.mjs'
          - 'src/mcp-proxy*.mjs'
          - 'src/client.mjs'
          - 'support/fake-mcp-server.mjs'
          - 'demo/mcp-smoke.mjs'
          - 'bench/mcp-redteam.mjs'

audit:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/audit.mjs'

arena:
  - changed-files:
      - any-glob-to-any-file:
          - 'arena/**'
          - '.github/workflows/arena.yml'

bench:
  - changed-files:
      - any-glob-to-any-file:
          - 'bench/**'
          - 'native/bench.mjs'

fuzz:
  - changed-files:
      - any-glob-to-any-file:
          - 'fuzz/**'
          - '.clusterfuzzlite/**'
          - '.github/workflows/cflite.yml'

native:
  - changed-files:
      - any-glob-to-any-file:
          - 'native/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
          - '**/*.test.mjs'
          - '.github/workflows/ci.yml'

examples:
  - changed-files:
      - any-glob-to-any-file:
          - 'examples/**'
          - 'demo/**'

# The security posture of the project itself — its policy and the workflows
# that enforce it — not "this PR fixes a vulnerability", which stays manual.
security:
  - changed-files:
      - any-glob-to-any-file:
          - 'SECURITY.md'
          - '.github/workflows/codeql.yml'
          - '.github/workflows/scorecard.yml'

release:
  - changed-files:
      - any-glob-to-any-file:
          - 'CHANGELOG.md'
          - 'npm-stub/**'
          - '.github/workflows/publish.yml'
          - '.github/workflows/auto-release.yml'
          - '.github/workflows/distribution-check.yml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
          - 'arena/requirements-*.txt'
          - 'arena/requirements-*.in'
          - 'native/go.mod'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/dependabot.yml'
          - '.github/labeler.yml'
