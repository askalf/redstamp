# Manual: posts the fleet review-lane statuses on every open same-repo PR. Run it right after
# the fleet/* contexts become required checks, so PRs opened before that report.
name: Fleet status backfill

on:
  workflow_dispatch:

permissions: {}

jobs:
  backfill:
    runs-on: ${{ github.repository == 'askalf/redstamp' && fromJSON('["self-hosted","redstamp-exec"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - uses: askalf/ci/actions/fleet-status@84afdc10f7d8ae2b69f927ab962dff40449e12f7 # main 2026-11-28, askalf/ci#254
        with:
          all-open: 'true'
