name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.node }})
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on redstamp-exec, the
    # non-root one-job runners on our host, so the ubuntu-latest entries no longer wait on
    # GitHub's hosted queue. A fork's PR and a Dependabot PR run code nobody here wrote, so they
    # stay on GitHub's runners.
    # The Windows entry has no runner of ours and stays on GitHub's. It is the only place the
    # Windows-only paths run (the daemon's named pipe, its start-up and cleanup), and it is not a
    # required check, so a hosted outage or billing block never holds a merge on it. One Node
    # version is enough there: the Windows paths do not vary by Node version.
    # A fork repository has no redstamp-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ matrix.os != 'ubuntu-latest' && matrix.os || ((github.repository != 'askalf/redstamp' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","redstamp-exec"]')) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Type-check the declarations
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        # typescript and @types/node come from .github/tsc's lockfile so npm ci
        # verifies their integrity hashes; the project package.json stays
        # dependency-free.
        run: |
          npm ci --no-audit --no-fund --prefix .github/tsc
          .github/tsc/node_modules/.bin/tsc --noEmit --strict --target es2022 \
            --module node16 --moduleResolution node16 \
            --typeRoots .github/tsc/node_modules/@types --types node src/*.d.mts

  # test/labeler-config.test.mjs proves offline that every label the labeler
  # config and the issue forms APPLY is DECLARED in .github/labels.json. This
  # job proves the other half: that the declared set is the live one. Together
  # they make "every applied label exists in the repo" a checked invariant
  # instead of a comment. Edit a label on GitHub and in the manifest together,
  # or this fails and says which side moved.
  labels:
    name: labels (manifest matches the repo)
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on redstamp-exec, the
    # non-root one-job runners on our host, so this job no longer waits on GitHub's hosted queue.
    # A fork's PR and a Dependabot PR run code nobody here wrote, so they stay on GitHub's
    # runners. The required windows-latest test jobs above still run on GitHub's.
    # A fork repository has no redstamp-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/redstamp' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","redstamp-exec"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The declared label set is the live label set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | LC_ALL=C sort > live.txt
          node -e "JSON.parse(require('fs').readFileSync('.github/labels.json','utf8')).forEach(l => console.log(l.name))" | LC_ALL=C sort > declared.txt
          if ! diff -u declared.txt live.txt; then
            echo "::error::.github/labels.json and the repository's labels differ (- declared only, + live only). Change the label on GitHub AND in the manifest together."
            exit 1
          fi
          echo "$(wc -l < live.txt) labels, manifest matches"
