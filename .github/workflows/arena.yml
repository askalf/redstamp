name: Arena

# Runs the full agent-firewall arena — including live competitor adapters —
# on every PR that touches the arena, and on demand. This is what makes the
# scoreboard reproducible: anyone can re-run the numbers by re-running this
# workflow, on a neutral host neither tool's author controls.
#
# Competitors run live, pinned:
#   - Pipelock — downloaded as a pinned release artifact, verified against a
#     hardcoded sha256 before it runs.
#   - AEGIS — built from a pinned git commit (no published image) and started
#     as its documented docker/gateway container.

on:
  pull_request:
    paths:
      - 'arena/**'
      - 'src/**'
      - '.github/workflows/arena.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PIPELOCK_VERSION: 3.0.0
  PIPELOCK_SHA256: 3a9ceb11ab42f5a65bf0c440f01f5ee44e073663dd6a757d720c4a566b85c120
  # AEGIS v0.2.0 (2026-06-29) — pinned by commit, verified after checkout.
  AEGIS_COMMIT: 5f012d58111df8774e27b7f7c0bbb61fb2f9574f
  # mcp-firewall v0.1.0 (2026-02-19) is pinned by commit too, but the SHA is
  # inlined in its install step below: Scorecard's pin check reads raw text
  # and can't resolve an env var, so a variable here would read as unpinned.

jobs:
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install mcp-firewall deps (hash-pinned)
        # Its runtime deps, resolved once from the pinned commit's pyproject and
        # frozen with hashes (arena/requirements-mcp-firewall.in has the recipe).
        run: python -m pip install --quiet --require-hashes -r arena/requirements-mcp-firewall.txt

      - name: Install mcp-firewall (pinned commit, --no-deps)
        # mcp-firewall v0.1.0 (2026-02-19). Editable + --no-deps + literal SHA is
        # the commit-pinned pip form Scorecard credits; deps come from the
        # hash-pinned step above.
        run: |
          set -euo pipefail
          python -m pip install --quiet --no-deps -e "git+https://github.com/ressl/mcp-firewall.git@5f01d8b66480cdc2b7c7a6850e239e4d0f65df07#egg=mcp-firewall"
          python -c "import mcp_firewall; print('mcp-firewall importable')"

      # ── LLM Guard (Protect AI / Palo Alto Networks) ───────────────────────
      # A recognized-vendor guardrail that runs with NO paid key and NO gated
      # model: its default prompt-injection classifier
      # (protectai/deberta-v3-base-prompt-injection-v2) is public — only the
      # -small variant is gated. Partial-axis by design (it screens model I/O,
      # not shell semantics); see arena/adapters.json for the honest read.
      - name: Cache HuggingFace models (LLM Guard)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-llm-guard-0.3.16-${{ runner.os }}

      - name: Install LLM Guard (pinned)
        run: |
          set -euo pipefail
          python -m pip install --quiet 'llm-guard==0.3.16'
          python -c "import llm_guard; print('llm-guard importable')"

      - name: Download pipelock (pinned) + verify sha256
        run: |
          set -euo pipefail
          curl -sSL -o "pipelock_${PIPELOCK_VERSION}_linux_amd64.tar.gz" \
            "https://github.com/luckyPipewrench/pipelock/releases/download/v${PIPELOCK_VERSION}/pipelock_${PIPELOCK_VERSION}_linux_amd64.tar.gz"
          echo "${PIPELOCK_SHA256}  pipelock_${PIPELOCK_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          mkdir -p /tmp/pipelock-dist
          tar -xzf "pipelock_${PIPELOCK_VERSION}_linux_amd64.tar.gz" -C /tmp/pipelock-dist
          PL_BIN=$(find /tmp/pipelock-dist -type f -name pipelock | head -n1)
          test -n "$PL_BIN"
          chmod +x "$PL_BIN"
          echo "PL_BIN=$PL_BIN" >> "$GITHUB_ENV"
          "$PL_BIN" --version || true

      - name: Start pipelock scan API
        run: |
          set -euo pipefail
          nohup "$PL_BIN" run --config arena/adapters/pipelock.arena.yaml > /tmp/pipelock.log 2>&1 &
          echo "waiting for scan API…"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9090/api/v1/scan \
              -H 'Authorization: Bearer arena-token' -H 'Content-Type: application/json' \
              -d '{"kind":"tool_call","input":{"tool_name":"healthcheck"}}' || true)
            if [ "$code" = "200" ]; then echo "scan API up"; exit 0; fi
            sleep 1
          done
          echo "scan API never came up; daemon log:"; cat /tmp/pipelock.log; exit 1

      - name: Build + start AEGIS gateway (pinned commit)
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Justin0504/Aegis.git /tmp/aegis
          git -C /tmp/aegis fetch --depth 1 origin "$AEGIS_COMMIT"
          git -C /tmp/aegis checkout "$AEGIS_COMMIT"
          got=$(git -C /tmp/aegis rev-parse HEAD)
          test "$got" = "$AEGIS_COMMIT" || { echo "AEGIS commit mismatch: $got != $AEGIS_COMMIT"; exit 1; }
          docker build -t aegis-gateway:pinned -f /tmp/aegis/docker/gateway.Dockerfile /tmp/aegis
          # DB_PATH defaults to ./agentguard.db (cwd /app, root-owned) but the
          # image runs as USER node — point it at /data, which the Dockerfile
          # creates writable, or the gateway crashes on first write.
          #
          # RATE_LIMIT: AEGIS ships a 100-request/60s limit. A benchmark fires
          # thousands of calls from one host, so the default starves it — it
          # served ~1,000 requests and returned 429 to ~1,200 more, which made
          # it look non-deterministic (verdicts differed between scoring passes)
          # and marked it UNAVAILABLE on the 1,212-sample benign corpus. None of
          # that is a security property; it is request volume, not content. We
          # raise the limit so AEGIS is judged on its VERDICTS, the same
          # allowance already made for mcp-firewall's global rate limit.
          docker run -d --name aegis -p 8080:8080 \
            -e DB_PATH=/data/agentguard.db \
            -e RATE_LIMIT_MAX=100000000 \
            -e RATE_LIMIT_WINDOW=1000 \
            aegis-gateway:pinned
          echo "waiting for AEGIS gateway…"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)
            if [ "$code" = "200" ]; then echo "AEGIS up"; exit 0; fi
            sleep 2
          done
          echo "AEGIS never came up; container log:"; docker logs aegis || true; exit 1

      # Each corpus gets a freshly-restarted AEGIS so it starts with a clean
      # free-plan allowance — see arena/ci/aegis-reset.sh for why that is a
      # fairness measure (its quota is commercial, not a detection limit).
      - name: Run arena (default corpus)
        run: |
          set -euo pipefail
          bash arena/ci/aegis-reset.sh
          node arena/run.mjs

      - name: Run arena (external MITRE ATT&CK corpus)
        run: |
          set -euo pipefail
          bash arena/ci/aegis-reset.sh
          node arena/run.mjs --corpus external-corpus.json

      # The two corpora below are THIRD-PARTY: the commands come from Atomic Red
      # Team and tldr-pages, not from this repo. Scoring every competitor on them
      # is the most neutral comparison the arena can make — no participant wrote
      # the test set. The Atomic run measures recall on real ATT&CK commands; the
      # tldr run measures precision/friction on 1,200+ real benign commands,
      # which is where escalate-by-default postures show their true cost.
      - name: Run arena (third-party Atomic Red Team corpus)
        run: |
          set -euo pipefail
          bash arena/ci/aegis-reset.sh
          node arena/run.mjs --corpus thirdparty-atomic.json

      # 1,212 samples x 2 scoring passes exceeds AEGIS's free-plan allowance
      # even from a clean start, so it cannot be scored here without buying a
      # paid plan — which we decline to do to benchmark someone else's tool.
      # Its absence from this corpus is expected and excluded from the
      # assertion below; every other competitor is still required to score.
      - name: Run arena (third-party tldr-pages benign corpus)
        run: |
          set -euo pipefail
          bash arena/ci/aegis-reset.sh
          node arena/run.mjs --corpus thirdparty-tldr.json

      - name: Score redstamp on the third-party corpora (axis-aware)
        run: node arena/thirdparty.mjs

      - name: Assert competitors were actually scored
        run: |
          set -euo pipefail
          node -e "
            // AEGIS is exempt on the tldr corpus only: 1,212 samples x 2 passes
            // exceeds its free-plan check allowance, and we do not buy a paid
            // plan to benchmark another vendor's tool. Every other pairing is
            // required, so a competitor that silently fails to load still fails
            // the build rather than vanishing from the scoreboard.
            const files = [
              { f: 'arena/results.json', required: ['pipelock', 'aegis', 'mcp-firewall'] },
              { f: 'arena/external-corpus-results.json', required: ['pipelock', 'aegis', 'mcp-firewall'] },
              { f: 'arena/thirdparty-atomic-results.json', required: ['pipelock', 'aegis', 'mcp-firewall'] },
              { f: 'arena/thirdparty-tldr-results.json', required: ['pipelock', 'mcp-firewall'] },
            ];
            for (const { f, required } of files) {
              const rs = require('./' + f).results;
              for (const id of required) {
                const p = rs.find((r) => r.id === id);
                if (!p || !p.available) {
                  console.error(f + ': ' + id + ' missing or unavailable — ' + JSON.stringify(p && p.reason));
                  process.exit(1);
                }
                if (p.errored > 5) {
                  console.error(f + ': ' + id + ' errored on ' + p.errored + ' samples');
                  process.exit(1);
                }
              }
            }
            console.log('every required competitor scored on all ' + files.length + ' corpora');
          "

      # Reported, not enforced — yet. LLM Guard depends on a model download, so
      # a transient HuggingFace outage should not fail an unrelated PR. It moves
      # into the hard assertion above once it has proven stable across runs; the
      # point of printing it is that a silently-missing row is visible rather
      # than quietly absent from the scoreboard.
      - name: Report optional competitor availability
        if: always()
        run: |
          node -e "
            const rs = require('./arena/results.json').results;
            for (const id of ['llm-guard', 'llamafirewall']) {
              const p = rs.find((r) => r.id === id);
              if (p && p.available) {
                console.log(id + ': SCORED (recall ' + (100 * p.recallBlock).toFixed(1) + '%, precision ' + (100 * p.precision).toFixed(1) + '%)');
              } else {
                console.log('::warning::' + id + ' did not score — ' + ((p && p.reason) || 'not registered'));
              }
            }
          "

      - name: Dump AEGIS log
        if: always()
        run: docker logs aegis > /tmp/aegis.log 2>&1 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arena-results
          path: |
            arena/RESULTS.md
            arena/results.json
            arena/EXTERNAL-CORPUS-RESULTS.md
            arena/external-corpus-results.json
            arena/THIRDPARTY-ATOMIC-RESULTS.md
            arena/thirdparty-atomic-results.json
            arena/THIRDPARTY-TLDR-RESULTS.md
            arena/thirdparty-tldr-results.json
            arena/THIRD-PARTY-RESULTS.md
            /tmp/pipelock.log
            /tmp/aegis.log
