# Suppression scoped to arena/requirements-llm-guard.txt only.
#
# redstamp's own supply chain is not affected by anything below: none of these
# packages ship in the npm package (package.json files: ["src"]) and none are
# reachable from redstamp code. They are the pinned dependency closure of a
# COMPETITOR the arena scores — LLM Guard 0.3.16 — installed only inside the
# arena job on a throwaway runner.
#
# These versions were always what CI installed. Freezing the closure with
# hashes did not introduce them; it made them visible to OSV, which is the
# point of pinning. Every one is pinned exactly by llm-guard 0.3.16 itself, so
# the only way to "fix" them is to benchmark a version of LLM Guard its own
# maintainers do not ship. That would be a dishonest test, so it stays pinned
# and the exposure is documented here instead.
#
# Recheck trigger: a new llm-guard release. See arena/requirements-llm-guard.in.

# ── cryptography ────────────────────────────────────────────────────
[[IgnoredVulns]]
id = "PYSEC-2026-2141"
ignoreUntil = 2026-11-16
reason = """
cryptography 44.0.3 in the LLM Guard closure. Not bumpable here:
llm-guard 0.3.16 pins presidio-anonymizer==2.2.358, which caps
cryptography<44.1. Raising it would mean benchmarking a competitor against a
dependency set its own maintainers do not ship, which is not a fair test.
Not reachable from the arena either: the arena drives LLM Guard's
prompt-injection scanner over a fixed corpus of shell strings — no X.509
verification, no PKCS#7, no TLS. Clears when llm-guard widens the presidio
pin; re-check on the ignoreUntil date.
"""

