# ── transformers ────────────────────────────────────────────────────
[[IgnoredVulns]]
id = "PYSEC-2025-211"
ignoreUntil = 2026-11-16
reason = """
transformers 4.51.3 in the LLM Guard closure. Not bumpable: llm-guard
0.3.16 pins transformers==4.51.3 exactly, so any other version is a different
tool than the one under test. Mostly ReDoS in tokenizer and config parsing,
reached by attacker-controlled model files or chat templates — the arena
supplies neither: it loads one public pinned classifier
(protectai/deberta-v3-base-prompt-injection-v2) and feeds it a fixed corpus.
Clears when llm-guard bumps its transformers pin; re-check on the
ignoreUntil date.
"""

